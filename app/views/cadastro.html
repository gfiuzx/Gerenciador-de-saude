{% extends "base.html" %}
{% block title %}Criar conta · Saúde em Dia{% endblock %}
{% block guest_content %}
<span class="eyebrow">COMECE POR AQUI</span><h2>Crie sua conta</h2><p class="page-description">Seu espaço de acompanhamento em poucos passos.</p>
<form method="POST" class="form-modulo auth-form"><label for="nome">Nome completo</label><input type="text" name="nome" id="nome" required maxlength="100" autocomplete="name" placeholder="Como podemos chamar você?"><label for="email">E-mail</label><input type="email" name="email" id="email" required maxlength="120" autocomplete="email" placeholder="seuemail@exemplo.com"><label for="senha">Senha</label><input type="password" name="senha" id="senha" required minlength="6" autocomplete="new-password" placeholder="Mínimo de 6 caracteres"><label for="confirmar_senha">Confirmar senha</label><input type="password" name="confirmar_senha" id="confirmar_senha" required minlength="6" autocomplete="new-password" placeholder="Repita a senha"><button class="btn btn-primary btn-full" type="submit">Criar minha conta →</button></form>
<p class="auth-switch">Já tem uma conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
{% endblock %}
