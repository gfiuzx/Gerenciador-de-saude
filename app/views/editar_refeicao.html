{% extends "base.html" %}
{% block content %}
<div class="module-card"><h2>Editar refeição</h2>
<form method="POST"><label for="titulo">Nome</label><input id="titulo" name="titulo" maxlength="100" value="{{ item.titulo }}" required><label for="descricao">Descrição</label><input id="descricao" name="descricao" maxlength="500" value="{{ item.descricao or '' }}"><label for="calorias">Calorias</label><input id="calorias" name="calorias" type="number" min="0" max="10000" step="0.1" value="{{ item.calorias if item.calorias is not none else 0 }}"><button type="submit" class="btn btn-primary">Salvar alterações</button></form>
<p class="back-link"><a href="{{ url_for('auth.pagina_refeicoes') }}">Voltar às refeições</a></p>
</div>
{% endblock %}
